# Base PostgreSQL du projet. Démarrage :  docker compose up -d
# Les identifiants sont lus dans le fichier .env (jamais versionné, voir .env.example).
services:
  postgres:
    image: postgres:17-alpine
    container_name: oms-odd3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Exposé uniquement sur la machine locale. Port 5433 côté hôte pour ne pas entrer
      # en conflit avec un éventuel PostgreSQL déjà installé sur le port standard 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # les données survivent à l'arrêt du conteneur
    healthcheck:
      # « Prêt » signifie que PostgreSQL accepte les connexions, pas seulement que le conteneur tourne.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
